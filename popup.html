<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Shopee Uploader</title>
  <style>
    body{width:330px;margin:0;padding:14px;background:#f7f8fa;color:#222;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{margin:0 0 4px;color:#ee4d2d;font-size:15px}p{margin:0 0 12px;color:#666;line-height:1.45}.card{margin:10px 0;padding:10px;background:#fff;border-radius:8px}label{display:block;margin:8px 0 4px;font-weight:600}input{width:100%;font-size:11px}button{width:100%;margin-top:10px;padding:8px;border:0;border-radius:5px;background:#ee4d2d;color:#fff;font-weight:700;cursor:pointer}.status{margin-top:10px;line-height:1.5}.ok{color:#19763b}.err{color:#bd2c25}.info{color:#1565c0}
  </style>
</head>
<body>
  <h1>🚀 Shopee Uploader</h1>
  <p>Nạp dữ liệu listing và SKU một lần, sau đó mở trang Shopee để chạy.</p>
  <div class="card">
    <label for="listing-file">File listing (abura.hcm.xlsx)</label>
    <input id="listing-file" type="file" accept=".xlsx,.xls">
    <label for="doris-file">File SKU (FILE GIÁ DORIS.xlsx)</label>
    <input id="doris-file" type="file" accept=".xlsx,.xls">
    <button id="load-sources">Nạp dữ liệu</button>
    <div id="status" class="status info">Chưa nạp dữ liệu.</div>
  </div>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
